# nginx in front of Django: serves /static/ itself (with Range requests,
# which Safari needs to play the exercise videos) and passes the rest to gunicorn.
server {
    listen 80;
    client_max_body_size 5m;

    location /static/ {
        alias /static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
