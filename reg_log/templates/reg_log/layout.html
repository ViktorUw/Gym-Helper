{% load static %}
<!DOCTYPE html>
<html lang="pl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{% block title %}Gym Helper{% endblock %}</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap"
		/>
		<link rel="stylesheet" href="{% static 'main/css/style.css' %}?v=2" />
	</head>
	<body class="auth {% block body_class %}{% endblock %}">
		{% include 'reg_log/messages.html' %}
		<header class="auth__top">
			<a class="wordmark" href="{% url 'homepage' %}">
				<span class="wordmark__bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
				Gym Helper
			</a>
		</header>
		<main class="auth__main">
			{% block content %}{% endblock %}
		</main>
	</body>
</html>
