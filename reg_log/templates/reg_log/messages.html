{% if messages %}
<div class="toasts" role="status">
	{% for message in messages %}
	<div class="toast{% if message.level_tag == 'error' %} toast--error{% endif %}">
		<span>{{ message }}</span>
		<button type="button" class="toast__close" aria-label="Zamknij">&times;</button>
	</div>
	{% endfor %}
</div>
<script>
	document.querySelectorAll('.toast__close').forEach(function (button) {
		button.addEventListener('click', function () {
			button.parentElement.remove();
		});
	});
</script>
{% endif %}
