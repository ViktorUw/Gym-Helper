{% extends 'main/layout.html' %}

{% block title %}{{ exercise.name }} – {% endblock %}

{% block content %}
<a class="back" href="{% url 'exercisesPage' %}">
	<span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
	Ćwiczenia
</a>

<article class="exercise plate-{{ exercise.category.plate }}">
	<div>
		<span class="chip"><span class="plate-dot" aria-hidden="true"></span>{{ exercise.category.name }}</span>
		<h1 class="exercise__title">{{ exercise.name }}</h1>
		<p class="exercise__desc">{{ exercise.description|default:"Brak opisu." }}</p>
	</div>
	{% if exercise.video %}
	<figure class="media">
		<img src="/static/exercises/jpg/{{ exercise.video }}.gif" alt="Technika: {{ exercise.name }}" />
	</figure>
	{% endif %}
</article>
{% endblock %}
