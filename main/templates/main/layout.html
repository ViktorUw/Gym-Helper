{% load static %}
<!DOCTYPE html>
<html lang="pl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{% block title %}{% endblock %}Gym Helper</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0"
		/>
		<link rel="stylesheet" href="{% static 'main/css/style.css' %}?v=4" />
	</head>
	<body>
		{% with path=request.path %}
		<header class="site-header">
			<div class="site-header__inner">
				<a class="wordmark" href="{% url 'mainPage' %}">
					<span class="wordmark__bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
					Gym Helper
				</a>
				<nav class="nav" aria-label="Główna nawigacja">
					<a href="{% url 'trainingsPage' %}" {% if '/completed_trainings/' in path %}aria-current="page"{% endif %}>Treningi</a>
					<a href="{% url 'trainingPlansPage' %}" {% if '/training/' in path %}aria-current="page"{% endif %}>Plany</a>
					<a href="{% url 'exercisesPage' %}" {% if '/exercises/' in path %}aria-current="page"{% endif %}>Ćwiczenia</a>
				</nav>
				<div class="account">
					<a class="account__user" href="{% url 'userPage' %}" {% if path == '/user/' %}aria-current="page"{% endif %}>
						<span class="material-symbols-outlined" aria-hidden="true">person</span>
						<span class="account__name">{{ user.first_name }}</span>
					</a>
					<form method="POST" action="{% url 'logout' %}">
						{% csrf_token %}
						<button type="submit" class="account__logout">Wyloguj</button>
					</form>
				</div>
			</div>
		</header>
		{% endwith %}

		{% include 'reg_log/messages.html' %}

		<main class="page {% block page_class %}{% endblock %}">
			{% block content %}{% endblock %}
		</main>
	</body>
</html>
